<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Log</title>
<style>
  :root{
    --bg: #121214;
    --card: #1b1b1e;
    --card-hover: #202024;
    --line: #2a2a2e;
    --text: #eae7e1;
    --muted: #8c8c92;
    --muted-2: #5f5f66;
    --idea: #9a8cd9;
    --tracking: #d9a441;
    --awaiting: #d9707a;
    --mixing: #4fb3a9;
    --mastering: #5b8fd9;
    --done: #5fae67;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height:100vh;
    padding-bottom:100px;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 0; }

  header{ margin-bottom:22px; }
  h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 4px;
  }
  .sub{ color:var(--muted); font-size:14px; margin:0; }

  .tabs{
    display:flex;
    gap:4px;
    margin:20px 0 18px;
    background:var(--card);
    border-radius:12px;
    padding:4px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    transition:background .15s, color .15s;
    line-height:1.25;
  }
  .tab.active{ background:var(--line); color:var(--text); }

  .project{
    margin-bottom:14px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
  }
  .project-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 14px;
    cursor:pointer;
  }
  .caret{
    width:9px; height:9px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:rotate(-45deg);
    transition:transform .15s;
    flex-shrink:0;
    margin-left:2px;
  }
  .project.collapsed .caret{ transform:rotate(45deg); }
  .project-name{
    flex:1;
    font-size:17px;
    font-weight:700;
    background:transparent;
    border:none;
    color:var(--text);
    outline:none;
    min-width:0;
    padding:2px 0;
  }
  .count{
    font-size:12px;
    color:var(--muted-2);
    font-variant-numeric: tabular-nums;
  }
  .del-project{
    color:var(--muted-2);
    font-size:18px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
  }

  .songs{ border-top:1px solid var(--line); }
  .project.collapsed .songs{ display:none; }
  .project.collapsed .add-song-row{ display:none; }

  .song{
    display:flex;
    flex-direction:column;
    gap:7px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .song:last-child{ border-bottom:none; }

  .song-top{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .dot{
    width:14px; height:14px;
    border-radius:5px;
    flex-shrink:0;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
  }

  .song-title{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:15px;
    font-weight:600;
    outline:none;
    padding:1px 0;
  }
  .song-note{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:13px;
    width:100%;
    outline:none;
    padding:1px 0 1px 24px;
  }
  .song-note::placeholder, .song-title::placeholder{ color:var(--muted-2); }

  .song-progress{
    display:flex;
    align-items:center;
    gap:7px;
    padding-left:24px;
  }
  .song-progress-track{
    flex:1;
    height:4px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .song-progress-fill{
    height:100%;
    border-radius:3px;
    transition:width .25s;
  }
  .song-progress-pct{
    font-size:10px;
    font-weight:700;
    color:var(--muted-2);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
    width:28px;
    text-align:right;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding-left:24px;
  }
  .task-chip{
    width:30px; height:24px;
    border-radius:7px;
    border:1.5px solid var(--chip-color);
    background:transparent;
    color:var(--chip-color);
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }
  .task-chip.done{
    background:var(--chip-color);
    color:var(--bg);
  }

  .release-toggle{
    margin-left:24px;
    align-self:flex-start;
    background:transparent;
    border:1.5px solid var(--muted-2);
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    padding:6px 10px;
    border-radius:100px;
    cursor:pointer;
  }
  .release-toggle.done{
    background:var(--done);
    border-color:var(--done);
    color:var(--bg);
  }

  .del-song{
    color:var(--muted-2);
    font-size:16px;
    padding:2px 2px 2px 4px;
    cursor:pointer;
    flex-shrink:0;
  }

  .add-song-row{
    padding:10px 14px 12px;
  }
  .add-song-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .add-song-btn:before{ content:"+ "; }

  .add-project{
    width:100%;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:14px;
    color:var(--muted);
    font-size:15px;
    font-weight:600;
    padding:14px;
    cursor:pointer;
    margin-top:6px;
  }

  /* Overview / by-stage view */
  .stage-section{ margin-bottom:22px; }
  .stage-section-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    padding-left:2px;
  }
  .stage-dot-lg{ width:10px; height:10px; border-radius:4px; }
  .stage-section-title{ font-size:14px; font-weight:700; color:var(--muted); }
  .stage-section-count{ font-size:12px; color:var(--muted-2); }
  .overview-song{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    padding:9px 12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:6px;
  }
  .overview-song .t{ font-size:14px; font-weight:600; flex-shrink:0; }
  .overview-song .p{ font-size:12px; color:var(--muted-2); flex-shrink:0; }
  .overview-song .n{ font-size:12px; color:var(--muted); flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .overview-progress{
    width:100%;
    flex-basis:100%;
    height:3px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    margin-top:1px;
  }
  .overview-progress-fill{ height:100%; border-radius:3px; }
  .empty-stage{ color:var(--muted-2); font-size:13px; padding:2px 2px 0; }

  /* Palette popover */
  .palette{
    position:fixed;
    z-index:50;
    background:#242428;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    display:none;
  }
  .palette.open{ display:block; }
  .palette-row{ display:flex; gap:6px; flex-wrap:wrap; max-width:170px; }
  .palette-swatch{
    width:24px; height:24px;
    border-radius:7px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
  }

  /* Stage menu popover */
  .stage-menu{
    position:fixed;
    z-index:50;
    background:#242428;
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    display:none;
    min-width:150px;
  }
  .stage-menu.open{ display:block; }
  .stage-menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
  }
  .stage-menu-item:hover{ background:var(--card-hover); }
  .stage-menu-dot{ width:10px; height:10px; border-radius:4px; }

  .overlay{
    position:fixed; inset:0; z-index:40; display:none;
  }
  .overlay.open{ display:block; }

  .fab{
    position:fixed;
    right:20px; bottom:26px;
    width:54px; height:54px;
    border-radius:50%;
    background:var(--text);
    color:var(--bg);
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    cursor:pointer;
    border:none;
  }

  .todo-add{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .todo-input{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    outline:none;
  }
  .todo-input::placeholder{ color:var(--muted-2); }
  .todo-add-btn{
    background:var(--text);
    color:var(--bg);
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:700;
    width:46px;
    cursor:pointer;
    flex-shrink:0;
  }
  .todo-item{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    transition:opacity .35s, transform .35s;
  }
  .todo-item.checking{ opacity:0; transform:translateX(10px); }
  .todo-box{
    width:19px; height:19px;
    border-radius:6px;
    border:2px solid var(--muted-2);
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .todo-box svg{ width:12px; height:12px; opacity:0; }
  .todo-item.checking .todo-box{ background:var(--done); border-color:var(--done); }
  .todo-item.checking .todo-box svg{ opacity:1; }
  .todo-text{
    flex:1;
    font-size:15px;
    line-height:1.4;
    padding-top:1px;
    word-break:break-word;
  }
  .todo-empty{
    color:var(--muted-2);
    font-size:14px;
    padding:20px 2px;
    text-align:center;
  }

  .released-section{ margin-bottom:22px; }
  .released-section-title{
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:8px;
    padding-left:2px;
  }
  .released-item{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    transition:opacity .3s, transform .3s;
  }
  .released-box{
    width:19px; height:19px;
    border-radius:6px;
    border:2px solid var(--muted-2);
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .released-box svg{ width:12px; height:12px; opacity:0; }
  .released-box.checked{ background:var(--done); border-color:var(--done); }
  .released-box.checked svg{ opacity:1; }
  .released-main{ flex:1; min-width:0; }
  .released-title{ font-size:15px; font-weight:600; }
  .released-meta{ font-size:12px; color:var(--muted-2); margin-top:2px; }

  .toast{
    position:fixed;
    bottom:96px; left:50%;
    transform:translateX(-50%) translateY(8px);
    background:#242428;
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    padding:9px 16px;
    border-radius:100px;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Session Log</h1>
    <p class="sub">Every production, at a glance.</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="project">By Project</div>
    <div class="tab" data-view="stage">To Finish</div>
    <div class="tab" data-view="todo">To-Do</div>
    <div class="tab" data-view="released">Released</div>
  </div>

  <div id="projectView"></div>
  <div id="stageView" style="display:none;"></div>
  <div id="todoView" style="display:none;"></div>
  <div id="releasedView" style="display:none;"></div>
</div>

<button class="fab" id="fab">+</button>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"></div>
<div class="palette" id="palette"></div>
<div class="stage-menu" id="stageMenu"></div>

<script>
const STORAGE_KEY = "songtracker:data";

const TASKS = [
  { key:"idea",     label:"Idea",           short:"ID", color:"#9a8cd9" },
  { key:"tracking", label:"Tracking",       short:"TR", color:"#d9a441" },
  { key:"drums",    label:"Drums",          short:"DR", color:"#cf6a4a" },
  { key:"vocals",   label:"Vocals",         short:"VO", color:"#d9707a" },
  { key:"bgvox",    label:"Background Vox", short:"BV", color:"#d488c9" },
  { key:"mixing",   label:"Mixing",         short:"MX", color:"#4fb3a9" },
  { key:"master",   label:"Master",         short:"MA", color:"#5b8fd9" },
];
const RELEASE_INFO = { key:"released", label:"Release", color:"#5fae67" };
const SWATCHES = ["#9a8cd9","#d9a441","#cf6a4a","#d9707a","#d488c9","#4fb3a9","#5b8fd9","#5fae67","#8c8c92","#e8956f","#d9c341","#e8e7e1"];

// migrate stage keys from earlier (single-stage) versions of this tool
const LEGACY_STAGE_MIGRATION = { awaiting:"tracking", mastering:"master", done:"released", splits:"released" };
function migrateStage(key){ return LEGACY_STAGE_MIGRATION[key] || key; }

function newTasks(){
  const t = {};
  TASKS.forEach(task=>{ t[task.key] = false; });
  return t;
}
function newSong(title){
  return { id:uid(), title: title||"", note:"", color:null, released:false, splitsSubmitted:false, tasks:newTasks() };
}

// convert a song still on the old single `stage` field to the new per-task checklist
function migrateSongToTasks(song){
  if(song.tasks) return;
  const order = TASKS.map(t=>t.key);
  const raw = migrateStage(song.stage || "idea");
  const tasks = newTasks();
  if(raw === "released"){
    order.forEach(k=>{ tasks[k] = true; });
    song.released = true;
  } else {
    const idx = order.indexOf(raw);
    const cutoff = idx === -1 ? 0 : idx;
    order.forEach((k,i)=>{ tasks[k] = i <= cutoff; });
    song.released = false;
  }
  song.tasks = tasks;
  delete song.stage;
}

function taskProgressPct(song){
  const total = TASKS.length;
  const done = TASKS.filter(t=>song.tasks[t.key]).length;
  return Math.round((done/total) * 100);
}
function colorForSong(song){
  if(song.color) return song.color;
  if(song.released) return RELEASE_INFO.color;
  let last = null;
  TASKS.forEach(t=>{ if(song.tasks[t.key]) last = t; });
  return last ? last.color : TASKS[0].color;
}
function uid(){ return Math.random().toString(36).slice(2,10); }

let data = { projects: [], todos: [] };
let currentView = "project";

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = JSON.parse(raw);
      if(!data.todos) data.todos = [];
      data.projects.forEach(p=>p.songs.forEach(s=>{
        migrateSongToTasks(s);
        if(typeof s.splitsSubmitted !== "boolean") s.splitsSubmitted = false;
        if(typeof s.released !== "boolean") s.released = false;
      }));
    }
    else { data = seedData(); save(); }
  }catch(e){
    data = seedData();
  }
  render();
}

function seedData(){
  const laneSong = (title, note, doneThrough)=>{
    const s = newSong(title);
    s.note = note || "";
    const order = TASKS.map(t=>t.key);
    const cutoff = order.indexOf(doneThrough);
    order.forEach((k,i)=>{ s.tasks[k] = i <= cutoff; });
    return s;
  };
  return {
    todos: [],
    projects: [
      { id: uid(), name:"Last Min", collapsed:false, songs:[
        laneSong("On the Road", "", "mixing"),
        laneSong("Not the One", "", "mixing"),
        laneSong("Lanai", "", "mixing"),
        laneSong("Enough", "", "mixing"),
        laneSong("Kanaka", "add gtrs", "tracking"),
      ]},
    ]
  };
}

async function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    showToast("Couldn't save — storage may be full or blocked");
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ---------- Project view ---------- */
function renderProjectView(){
  const el = document.getElementById('projectView');
  el.innerHTML = "";
  data.projects.forEach(proj=>{
    const card = document.createElement('div');
    card.className = "project" + (proj.collapsed ? " collapsed" : "");

    const head = document.createElement('div');
    head.className = "project-head";
    head.innerHTML = `<span class="caret"></span>`;
    const nameInput = document.createElement('input');
    nameInput.className = "project-name";
    nameInput.value = proj.name;
    nameInput.addEventListener('click', e=>e.stopPropagation());
    nameInput.addEventListener('change', ()=>{ proj.name = nameInput.value.trim() || "Untitled"; save(); });
    const countSpan = document.createElement('span');
    countSpan.className = "count";
    countSpan.textContent = proj.songs.length;
    const delBtn = document.createElement('span');
    delBtn.className = "del-project";
    delBtn.textContent = "×";
    delBtn.addEventListener('click', e=>{
      e.stopPropagation();
      if(confirm(`Delete "${proj.name}" and all its songs?`)){
        data.projects = data.projects.filter(p=>p.id!==proj.id);
        save(); render();
      }
    });
    head.appendChild(nameInput);
    head.appendChild(countSpan);
    head.appendChild(delBtn);
    head.addEventListener('click', ()=>{ proj.collapsed = !proj.collapsed; save(); render(); });
    card.appendChild(head);

    const songsWrap = document.createElement('div');
    songsWrap.className = "songs";
    proj.songs.forEach(song=>{
      songsWrap.appendChild(renderSongRow(proj, song));
    });
    card.appendChild(songsWrap);

    const addRow = document.createElement('div');
    addRow.className = "add-song-row";
    const addBtn = document.createElement('button');
    addBtn.className = "add-song-btn";
    addBtn.textContent = "Add song";
    addBtn.addEventListener('click', ()=>{
      proj.songs.push(newSong());
      save(); render();
      const inputs = card.querySelectorAll('.song-title');
      const last = inputs[inputs.length-1];
      if(last) last.focus();
    });
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    el.appendChild(card);
  });

  const addProjectBtn = document.createElement('button');
  addProjectBtn.className = "add-project";
  addProjectBtn.textContent = "+ New project";
  addProjectBtn.addEventListener('click', ()=>{
    data.projects.unshift({ id:uid(), name:"", collapsed:false, songs:[] });
    save(); render();
    const inputs = document.querySelectorAll('.project-name');
    if(inputs[0]){ inputs[0].focus(); }
  });
  el.appendChild(addProjectBtn);
}

function renderSongRow(proj, song){
  const row = document.createElement('div');
  row.className = "song";

  const top = document.createElement('div');
  top.className = "song-top";

  const dot = document.createElement('div');
  dot.className = "dot";
  dot.style.background = colorForSong(song);
  dot.addEventListener('click', (e)=> openPalette(e, song));
  top.appendChild(dot);

  const titleInput = document.createElement('input');
  titleInput.className = "song-title";
  titleInput.placeholder = "Song title";
  titleInput.value = song.title;
  titleInput.addEventListener('change', ()=>{ song.title = titleInput.value; save(); });
  top.appendChild(titleInput);

  const del = document.createElement('span');
  del.className = "del-song";
  del.textContent = "×";
  del.addEventListener('click', ()=>{
    proj.songs = proj.songs.filter(s=>s.id!==song.id);
    save(); render();
  });
  top.appendChild(del);

  row.appendChild(top);

  const noteInput = document.createElement('input');
  noteInput.className = "song-note";
  noteInput.placeholder = "Note — e.g. waiting for vox";
  noteInput.value = song.note;
  noteInput.addEventListener('change', ()=>{ song.note = noteInput.value; save(); });
  row.appendChild(noteInput);

  const progressWrap = document.createElement('div');
  progressWrap.className = "song-progress";
  const track = document.createElement('div');
  track.className = "song-progress-track";
  const fill = document.createElement('div');
  fill.className = "song-progress-fill";
  const pct = taskProgressPct(song);
  fill.style.width = pct + "%";
  fill.style.background = colorForSong(song);
  track.appendChild(fill);
  const pctLabel = document.createElement('span');
  pctLabel.className = "song-progress-pct";
  pctLabel.textContent = pct + "%";
  progressWrap.appendChild(track);
  progressWrap.appendChild(pctLabel);
  row.appendChild(progressWrap);

  const chipRow = document.createElement('div');
  chipRow.className = "chip-row";
  TASKS.forEach(task=>{
    const chip = document.createElement('button');
    const done = !!song.tasks[task.key];
    chip.className = "task-chip" + (done ? " done" : "");
    chip.title = task.label;
    chip.style.setProperty('--chip-color', task.color);
    chip.textContent = task.short;
    chip.addEventListener('click', ()=>{
      song.tasks[task.key] = !song.tasks[task.key];
      save(); render();
    });
    chipRow.appendChild(chip);
  });
  row.appendChild(chipRow);

  const releaseBtn = document.createElement('button');
  releaseBtn.className = "release-toggle" + (song.released ? " done" : "");
  releaseBtn.textContent = song.released ? "Released ✓" : "Mark as Released";
  releaseBtn.addEventListener('click', ()=>{
    song.released = !song.released;
    save(); render();
  });
  row.appendChild(releaseBtn);

  return row;
}

/* ---------- "To Finish" view — what's left per song ---------- */
function renderStageView(){
  const el = document.getElementById('stageView');
  el.innerHTML = "";

  const active = [];
  data.projects.forEach(proj=>{
    proj.songs.forEach(song=>{
      if(song.title.trim() && !song.released) active.push({ proj, song });
    });
  });

  if(active.length === 0){
    const empty = document.createElement('div');
    empty.className = "empty-stage";
    empty.textContent = "Nothing in progress right now.";
    el.appendChild(empty);
    return;
  }

  const ready = active.filter(({song}) => TASKS.every(t=>song.tasks[t.key]));
  if(ready.length){
    const section = document.createElement('div');
    section.className = "stage-section";
    section.innerHTML = `<div class="stage-section-head">
      <span class="stage-dot-lg" style="background:${RELEASE_INFO.color}"></span>
      <span class="stage-section-title">Ready to release</span>
      <span class="stage-section-count">${ready.length}</span>
    </div>`;
    ready.forEach(({proj, song})=>{
      const row = document.createElement('div');
      row.className = "released-item";
      const box = document.createElement('div');
      box.className = "released-box";
      box.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--bg')}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      box.title = "Mark as Released";
      box.addEventListener('click', ()=>{
        song.released = true;
        save(); render();
      });
      const main = document.createElement('div');
      main.className = "released-main";
      main.innerHTML = `<div class="released-title">${escapeHtml(song.title)}</div>
        <div class="released-meta">${escapeHtml(proj.name)} · all parts done</div>`;
      row.appendChild(box);
      row.appendChild(main);
      section.appendChild(row);
    });
    el.appendChild(section);
  }

  TASKS.forEach(task=>{
    const items = active.filter(({song}) => !song.tasks[task.key]);
    const section = document.createElement('div');
    section.className = "stage-section";
    const head = document.createElement('div');
    head.className = "stage-section-head";
    head.innerHTML = `<span class="stage-dot-lg" style="background:${task.color}"></span>
      <span class="stage-section-title">Needs ${task.label}</span>
      <span class="stage-section-count">${items.length}</span>`;
    section.appendChild(head);

    if(items.length === 0){
      const empty = document.createElement('div');
      empty.className = "empty-stage";
      empty.textContent = "All caught up";
      section.appendChild(empty);
    } else {
      items.forEach(({proj, song})=>{
        const row = document.createElement('div');
        row.className = "overview-song";
        const pct = taskProgressPct(song);
        const color = colorForSong(song);
        row.innerHTML = `<span class="t">${escapeHtml(song.title)}</span>
          <span class="p">${escapeHtml(proj.name)}</span>
          <span class="n">${escapeHtml(song.note || "")}</span>
          <div class="overview-progress"><div class="overview-progress-fill" style="width:${pct}%;background:${color}"></div></div>`;
        section.appendChild(row);
      });
    }
    el.appendChild(section);
  });
}

/* ---------- To-Do view ---------- */
function renderTodoView(){
  const el = document.getElementById('todoView');
  el.innerHTML = "";

  const addRow = document.createElement('div');
  addRow.className = "todo-add";
  const input = document.createElement('input');
  input.className = "todo-input";
  input.placeholder = "e.g. Send to Demitri for mixing";
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') addTodo(); });
  const addBtn = document.createElement('button');
  addBtn.className = "todo-add-btn";
  addBtn.textContent = "+";
  addBtn.addEventListener('click', addTodo);
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  el.appendChild(addRow);

  function addTodo(){
    const val = input.value.trim();
    if(!val) return;
    data.todos.unshift({ id: uid(), text: val });
    save();
    input.value = "";
    renderTodoView();
    document.querySelector('#todoView .todo-input').focus();
  }

  if(data.todos.length === 0){
    const empty = document.createElement('div');
    empty.className = "todo-empty";
    empty.textContent = "Nothing on your list — add what's next above.";
    el.appendChild(empty);
    return;
  }

  data.todos.forEach(todo=>{
    const row = document.createElement('div');
    row.className = "todo-item";
    row.dataset.id = todo.id;

    const box = document.createElement('div');
    box.className = "todo-box";
    box.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--bg')}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    box.addEventListener('click', ()=>{
      row.classList.add('checking');
      setTimeout(()=>{
        data.todos = data.todos.filter(t=>t.id !== todo.id);
        save();
        renderTodoView();
      }, 320);
    });

    const text = document.createElement('div');
    text.className = "todo-text";
    text.textContent = todo.text;

    row.appendChild(box);
    row.appendChild(text);
    el.appendChild(row);
  });
}

/* ---------- Released view ---------- */
function renderReleasedView(){
  const el = document.getElementById('releasedView');
  el.innerHTML = "";

  const needsSplits = [];
  const submitted = [];
  data.projects.forEach(proj=>{
    proj.songs.forEach(song=>{
      if(song.released && song.title.trim()){
        (song.splitsSubmitted ? submitted : needsSplits).push({ proj, song });
      }
    });
  });

  if(needsSplits.length === 0 && submitted.length === 0){
    const empty = document.createElement('div');
    empty.className = "todo-empty";
    empty.textContent = "Nothing released yet — songs land here once you mark them Released.";
    el.appendChild(empty);
    return;
  }

  function buildSection(title, items, checked){
    const section = document.createElement('div');
    section.className = "released-section";
    const head = document.createElement('div');
    head.className = "released-section-title";
    head.textContent = `${title} · ${items.length}`;
    section.appendChild(head);
    items.forEach(({proj, song})=>{
      const row = document.createElement('div');
      row.className = "released-item";
      const box = document.createElement('div');
      box.className = "released-box" + (checked ? " checked" : "");
      box.innerHTML = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--bg')}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      box.addEventListener('click', ()=>{
        song.splitsSubmitted = !checked;
        save();
        renderReleasedView();
      });
      const main = document.createElement('div');
      main.className = "released-main";
      main.innerHTML = `<div class="released-title">${escapeHtml(song.title)}</div>
        <div class="released-meta">${escapeHtml(proj.name)}${checked ? " · splits submitted" : " · splits pending"}</div>`;
      row.appendChild(box);
      row.appendChild(main);
      section.appendChild(row);
    });
    return section;
  }

  if(needsSplits.length){
    el.appendChild(buildSection("Needs backend splits", needsSplits, false));
  }
  if(submitted.length){
    el.appendChild(buildSection("Splits submitted", submitted, true));
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- Popovers ---------- */
const overlay = document.getElementById('overlay');
const paletteEl = document.getElementById('palette');
const stageMenuEl = document.getElementById('stageMenu');

function closePopovers(){
  paletteEl.classList.remove('open');
  stageMenuEl.classList.remove('open');
  overlay.classList.remove('open');
}
overlay.addEventListener('click', closePopovers);

function positionNear(el, target){
  const r = target.getBoundingClientRect();
  el.style.top = (r.bottom + 6) + "px";
  let left = r.left;
  const maxLeft = window.innerWidth - 190;
  if(left > maxLeft) left = maxLeft;
  el.style.left = Math.max(8,left) + "px";
}

function openPalette(e, song){
  e.stopPropagation();
  paletteEl.innerHTML = "";
  const row = document.createElement('div');
  row.className = "palette-row";
  SWATCHES.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = "palette-swatch";
    sw.style.background = c;
    sw.addEventListener('click', ()=>{
      song.color = c;
      save(); render(); closePopovers();
    });
    row.appendChild(sw);
  });
  const reset = document.createElement('div');
  reset.className = "palette-swatch";
  reset.style.background = "transparent";
  reset.style.border = "1px dashed var(--muted-2)";
  reset.title = "Use automatic color";
  reset.addEventListener('click', ()=>{
    song.color = null;
    save(); render(); closePopovers();
  });
  row.appendChild(reset);
  paletteEl.appendChild(row);
  positionNear(paletteEl, e.currentTarget);
  paletteEl.classList.add('open');
  overlay.classList.add('open');
}

/* ---------- Tabs / FAB ---------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('projectView').style.display = currentView === 'project' ? '' : 'none';
    document.getElementById('stageView').style.display = currentView === 'stage' ? '' : 'none';
    document.getElementById('todoView').style.display = currentView === 'todo' ? '' : 'none';
    document.getElementById('releasedView').style.display = currentView === 'released' ? '' : 'none';
    if(currentView === 'stage') renderStageView();
    if(currentView === 'todo') renderTodoView();
    if(currentView === 'released') renderReleasedView();
  });
});

document.getElementById('fab').addEventListener('click', ()=>{
  data.projects.unshift({ id:uid(), name:"", collapsed:false, songs:[newSong()] });
  save(); render();
  document.querySelector('.tab[data-view="project"]').click();
  const inputs = document.querySelectorAll('.project-name');
  if(inputs[0]) inputs[0].focus();
});

function render(){
  renderProjectView();
  if(currentView === 'stage') renderStageView();
  if(currentView === 'todo') renderTodoView();
  if(currentView === 'released') renderReleasedView();
}

load();
</script>
